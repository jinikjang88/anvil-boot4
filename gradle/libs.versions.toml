[versions]
# JVM / 빌드
java = "25"
springBoot = "4.0.0"
springDependencyManagement = "1.1.7"
foojayResolver = "0.10.0"

# 테스트
junit = "5.11.4"
assertj = "3.26.3"
testcontainers = "1.21.3"

# 인프라
postgresql = "42.7.4"

# 보안
jjwt = "0.12.6"

[libraries]
# Spring Boot 의존성 (버전은 Boot BOM 이 관리하므로 명시하지 않음)
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
# Jackson — Boot 4 에서 starter-web 의 transitive 로는 jackson-databind 가 컴파일 클래스패스에 들어오지 않을 수 있어 명시 의존
spring-boot-starter-json = { module = "org.springframework.boot:spring-boot-starter-json" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# Boot 4 에서 WebMvcTest 슬라이스 테스트는 별도 모듈로 분리됨
spring-boot-webmvc-test = { module = "org.springframework.boot:spring-boot-webmvc-test" }
# Security 테스트 헬퍼 (@WithMockUser 등)
spring-security-test = { module = "org.springframework.security:spring-security-test" }

# JWT (jjwt 0.12 — JSON Web Token 발급/검증)
jjwt-api     = { module = "io.jsonwebtoken:jjwt-api",     version.ref = "jjwt" }
jjwt-impl    = { module = "io.jsonwebtoken:jjwt-impl",    version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# 테스트
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }

# 드라이버
postgresql-driver = { module = "org.postgresql:postgresql", version.ref = "postgresql" }

# JPA / Hibernate (버전은 Spring Boot BOM 이 관리)
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
foojay-resolver-convention = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojayResolver" }
