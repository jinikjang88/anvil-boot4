spring:
  application:
    name: ch10-transaction
  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5433/anvil
    username: anvil
    password: anvil
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    # 트랜잭션 시작/커밋/롤백 로그
    org.springframework.transaction: DEBUG
