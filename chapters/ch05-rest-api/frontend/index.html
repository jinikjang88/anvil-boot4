<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ch05 — REST API 설계, 메뉴판처럼</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen">
  <main class="max-w-6xl mx-auto p-8">
    <header class="border-b border-anvil-muted pb-4 mb-8">
      <p class="text-anvil-muted text-sm">대장간 백엔드 · ch05-rest-api</p>
      <h1 class="text-3xl font-bold text-anvil-accent mt-1">REST API 설계 — 메뉴판처럼 만들기</h1>
      <p class="text-anvil-muted mt-2 text-sm">
        URL 은 명사, 동사는 HTTP 메서드. 왼쪽 메뉴판 카드에서 호출 → 오른쪽 컬렉션이 즉시 반영된다.
      </p>
    </header>

    <div class="grid lg:grid-cols-2 gap-6">
      <!-- 왼쪽: 메뉴판 카드들 (5개) -->
      <section id="menu" class="space-y-4"></section>

      <!-- 오른쪽: 현재 주문 컬렉션 -->
      <section class="card p-4 lg:sticky lg:top-4 self-start">
        <div class="flex items-baseline justify-between mb-3">
          <h2 class="font-medium">현재 컬렉션 <span id="totalBadge"
            class="ml-1 text-xs bg-anvil-muted text-white px-1.5 py-0.5 rounded">0</span></h2>
          <button id="refreshList" class="text-sm text-anvil-data hover:underline">새로고침</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-xs">
            <thead>
              <tr class="border-b border-anvil-muted">
                <th class="text-left py-1 pr-2">id (앞 8)</th>
                <th class="text-left py-1 pr-2">customer</th>
                <th class="text-left py-1 pr-2">status</th>
                <th class="text-right py-1 pr-2">total</th>
                <th class="text-left py-1">memo</th>
              </tr>
            </thead>
            <tbody id="ordersBody" class="font-mono"></tbody>
          </table>
        </div>
        <p class="mt-3 text-xs text-anvil-muted">
          상태 색: PENDING <span class="status-PENDING px-1">●</span>
          · CONFIRMED <span class="status-CONFIRMED px-1">●</span>
          · SHIPPED <span class="status-SHIPPED px-1">●</span>
          · DELIVERED <span class="status-DELIVERED px-1">●</span>
          · CANCELLED <span class="status-CANCELLED px-1">●</span>
        </p>
      </section>
    </div>

    <footer class="mt-8 text-xs text-anvil-muted leading-relaxed">
      백엔드: <code class="font-mono">/api/v1/orders</code> ·
      상태코드 매핑: 201 / 200 / 204 / 400 / 404 / 409
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
