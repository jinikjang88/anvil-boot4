spring:
  application:
    name: ch09-querydsl
  profiles:
    active: local

  datasource:
    url: jdbc:postgresql://localhost:5433/anvil
    username: anvil
    password: anvil
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 학습용 — 매 부팅마다 테이블 재생성. 운영 절대 금지.
      ddl-auto: create-drop
    show-sql: true
    # OSIV off — LAZY 누수 시 LazyInitializationException 으로 명시적 실패.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true

server:
  port: 8080

anvil:
  seed:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
